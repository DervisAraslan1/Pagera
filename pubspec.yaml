name: pagera
description: "Reels yerine kitap okutan Android uygulaması."
publish_to: 'none'
version: 0.2.0+4

environment:
  sdk: ^3.13.7

dependencies:
  archive: ^4.7.1
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.2
  flutter_timezone: ^5.1.1
  google_fonts: ^9.0.0
  google_mlkit_text_recognition: ^1.0.3
  html: ^0.15.7
  path_provider: ^2.1.6
  pdfrx: ^2.12.1
  pdfrx_engine: ^0.9.2
  timezone: ^0.11.2
  wakelock_plus: ^1.8.2
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Yazı tipleri uygulamaya gömülü (Fraunces, Literata, Inter — SIL Open Font License); internet gerekmez.
    - assets/google_fonts/
